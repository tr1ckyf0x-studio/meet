name: Deploy

on:
  push:
    branches:
      - main
    # A push that changes only specs or notes builds nothing.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# One run per branch at a time, so an older build never overwrites a newer image.
concurrency:
  group: deploy-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    # The self-hosted runner jvm-runner-earth on Earth. The Dockerfile runs the tests, the type
    # check and the build.
    runs-on: [self-hosted, jvm-runner]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            REVISION=${{ github.sha }}
          # :latest is what the Komodo stack deploys; :<sha> is what a rollback pins (TAG=<sha>).
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}

  # The server pulls the new image itself (Komodo on Earth); GitHub only sends a signed webhook
  # and has no SSH access.
  deploy:
    needs: build-and-push-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Komodo deploy
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::notice::the deploy webhook is not configured yet; the image is published only"
            exit 0
          fi
          body='{"ref":"${{ github.ref }}"}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //')
          curl -fsS --retry 3 --retry-delay 5 -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data "$body"
